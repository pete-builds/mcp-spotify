[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-spotify"
version = "0.2.0"
description = "MCP server for creating Spotify playlists from artist lists. Wraps the Spotify Web API (OAuth 2.0 authorization-code flow) and exposes tools for search, top-tracks lookup, and playlist creation/curation."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pete Stergion", email = "pstergion@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "spotify", "playlist", "claude", "music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=3.4.6",
    "httpx>=0.28.1",
    "uvicorn>=0.52.1",
    "python-dotenv>=1.2.2",
    # Pinned to an immutable commit tarball until pete-mcp-core is on PyPI.
    # Revert to "pete-mcp-core>=0.1.0" once it publishes.
    "pete-mcp-core @ https://github.com/pete-builds/pete-mcp-core/archive/15d210625cfcf1840b6b6e95cf10990214585104.tar.gz",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[project.scripts]
mcp-spotify = "server:main"

[project.urls]
Homepage = "https://github.com/pete-builds/mcp-spotify"
Repository = "https://github.com/pete-builds/mcp-spotify"
Issues = "https://github.com/pete-builds/mcp-spotify/issues"

[tool.hatch.metadata]
# Required for the pete-mcp-core commit-tarball pin above. Can be dropped
# once that dependency reverts to a plain PyPI version specifier.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Flat layout: keep the current top-level modules. A migration to
# src/mcp_spotify/ is a separate concern.
only-include = ["server.py", "healthcheck.py", "bootstrap.py", "clients"]

[tool.hatch.build.targets.sdist]
include = [
    "/server.py",
    "/healthcheck.py",
    "/bootstrap.py",
    "/clients",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/Dockerfile",
    "/docker-compose.yml",
    "/.env.example",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
